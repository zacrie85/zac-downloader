<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Tab Baru</title>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0f1e; color: #e8edf9; gap: 14px; padding: 24px;
    }
    .big { font-size: 46px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0; }
    p { font-size: 13px; color: #93a1c4; margin: 0; text-align: center; line-height: 1.9; max-width: 560px; }
    kbd { background: #16203d; border: 1px solid #1e2a4d; border-radius: 6px; padding: 2px 8px; font-size: 12px; color: #e8edf9; }
  </style>
</head>
<body>
  <div class="big">🎬</div>
  <h1>Tab Baru — Zac Downloader</h1>
  <p>
    Ketik alamat di address bar di atas lalu tekan <b>Enter</b>.<br />
    <kbd>Ctrl</kbd>+<kbd>T</kbd> tab baru &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>W</kbd> tutup tab &nbsp;·&nbsp;
    klik tengah / Ctrl+klik link → buka di tab baru &nbsp;·&nbsp; klik kanan → menu.
  </p>
</body>
</html>
